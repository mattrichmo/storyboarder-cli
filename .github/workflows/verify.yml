name: Storyboarder verification

on:
  push:
    branches: [main, feat/provenance-workspace-v2, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storyboarder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Preserve exact source checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive only committed source
        shell: bash
        run: |
          mkdir -p checkpoint
          git archive --format=zip --prefix=storyboarder/ -o checkpoint/storyboarder-source.zip HEAD
          git rev-parse HEAD > checkpoint/SOURCE_COMMIT.txt
          sha256sum checkpoint/storyboarder-source.zip > checkpoint/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: storyboarder-source-${{ github.sha }}
          path: checkpoint/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser interaction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install application and browser dependencies
        run: |
          python -m pip install -e ".[dev]" "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Build browser client
        working-directory: clients/web
        run: |
          npm ci
          npm run build
      - name: Verify navigation, narrow layouts and keyboard focus
        shell: bash
        run: |
          python scripts/create_demo.py "$RUNNER_TEMP/storyboarder-browser"
          python -m storyboarder ui --workspace "$RUNNER_TEMP/storyboarder-browser" --no-browser --port 17430 > "$RUNNER_TEMP/storyboarder-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for _ in range(80):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:17430/api/v1/session', timeout=1):
                      break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.25)
          else:
              raise SystemExit('Browser test server did not start')
          PY
          python clients/web/e2e/browser_acceptance.py --url http://127.0.0.1:17430 --smoke-only --source-forms --output artifacts/browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-regressions
          path: |
            artifacts/browser/
            ${{ runner.temp }}/storyboarder-browser.log
          retention-days: 14

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Python development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend build dependencies
        working-directory: clients/web
        run: npm ci
      - name: Build frontend from source
        working-directory: clients/web
        run: npm run build
      - name: Verify canvas geometry
        working-directory: clients/web
        run: npm test
      - name: Verify Python application
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Verify packaging
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            pytest-results.xml
            dist/
          retention-days: 14
