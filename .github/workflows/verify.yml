name: Storyboarder verification

on:
  push:
    branches: [main, feat/provenance-workspace-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storyboarder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Preserve exact source checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive only committed source
        shell: bash
        run: |
          mkdir -p checkpoint
          git archive --format=zip --prefix=storyboarder/ -o checkpoint/storyboarder-source.zip HEAD
          git rev-parse HEAD > checkpoint/SOURCE_COMMIT.txt
          sha256sum checkpoint/storyboarder-source.zip > checkpoint/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: storyboarder-source-${{ github.sha }}
          path: checkpoint/
          if-no-files-found: error
          retention-days: 14

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Python development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend build dependencies
        working-directory: clients/web
        run: npm ci
      - name: Build frontend from source
        working-directory: clients/web
        run: npm run build
      - name: Verify canvas geometry
        working-directory: clients/web
        run: npm test
      - name: Verify Python application
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Verify packaging
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            pytest-results.xml
            dist/
          retention-days: 14
